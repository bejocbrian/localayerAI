name: Deploy Web to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build Astro & Deploy via FTP

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clean and reinstall all dependencies
        run: |
          rm -rf node_modules apps/web/node_modules package-lock.json apps/web/package-lock.json
          npm install
          npm install --workspace=apps/web

      - name: Install platform-specific native bindings
        run: |
          npm install @rolldown/binding-linux-x64-gnu @astrojs/compiler-binding-linux-x64-gnu --workspace=apps/web

      - name: Build Astro site
        working-directory: apps/web
        run: npm run build

      - name: Verify build output
        run: ls -la apps/web/dist/

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ github.workspace }}/apps/web/dist/
          server-dir: public_html/
